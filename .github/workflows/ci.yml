name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POLICYLAB_PROVIDER: mock  # never call a live model in CI; no API key needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check policylab tests app
      - name: Unit tests (mock LLM)
        run: pytest
      - name: Offline evaluation (BM25 only, offline baseline)
        run: make eval-ci
      - name: Build site
        run: make site
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.md
            eval/results.json
            eval/charts/
